# PostgreSQL configuration (activate with: --spring.profiles.active=postgres)
spring.datasource.url=jdbc:postgresql://localhost:5432/interviewdb
spring.datasource.username=interview
spring.datasource.password=interview123
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Disable H2 console when using PostgreSQL
spring.h2.console.enabled=false
