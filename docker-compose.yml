version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: interview-postgres
    environment:
      POSTGRES_DB: interviewdb
      POSTGRES_USER: interview
      POSTGRES_PASSWORD: interview123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
